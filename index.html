<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b18"><title>GlobalLead AI — Find. Connect. Grow.</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>
:root{font-family:'DM Sans',sans-serif;color-scheme:dark;--bg:#080b18;--panel:#11182b;--line:#ffffff18;--text:#f4f6ff;--muted:#929db8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.app{display:flex;min-height:100vh}.side{width:245px;padding:24px 15px;background:#0b1020;border-right:1px solid var(--line)}.brand{font:700 19px 'Space Grotesk';padding:5px 10px 28px}.brand span,.accent{color:#a58aff}.workspace,.tile,.panel{border:1px solid var(--line);border-radius:12px}.workspace{padding:12px;margin-bottom:20px;font-size:12px;color:#cbd3e8}.group{font-size:9px;letter-spacing:1.5px;color:#73809e;margin:15px 10px 7px}.nav button{display:block;width:100%;padding:11px;margin:4px 0;text-align:left;background:transparent;color:#aab5cf;border:0;border-radius:9px;cursor:pointer;font:500 12px 'DM Sans'}.nav button.active,.nav button:hover{background:#7d5bff24;color:#d4c9ff}.main{flex:1;min-width:0;padding:0 32px;max-width:1500px;margin:auto}.top{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.top button,.chip,.secondary{background:#171e33;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;cursor:pointer}.hero{padding:40px 5px 28px}.eyebrow{color:#a58aff;font-size:10px;font-weight:700;letter-spacing:1.5px}.hero h1{font:700 clamp(30px,4vw,48px)/1.1 'Space Grotesk';margin:12px 0}.hero p,.sub{color:var(--muted);font-size:12px;line-height:1.7}.panel{padding:22px;background:linear-gradient(120deg,#191f3b,#11182b)}h2{font:600 20px 'Space Grotesk';margin:8px 0}form{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}input,select{min-height:46px;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:#0b1122;color:white;flex:1;min-width:160px}button.primary{background:linear-gradient(100deg,#7958f5,#477ff4);border:0;color:white;border-radius:9px;padding:0 18px;font-weight:700;cursor:pointer;min-height:46px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.chip{font-size:10px;padding:6px 10px}.notice{margin-top:12px;color:#9be3c5;font-size:11px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:17px 0}.tile{background:var(--panel);padding:16px}.tile small{display:block;color:var(--muted);font-size:10px}.tile b{display:block;font:700 25px 'Space Grotesk';margin:7px 0}.lower{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}.empty{min-height:145px;display:grid;place-content:center;text-align:center;color:var(--muted);font-size:11px;line-height:1.7}.empty strong{color:var(--text);font-size:13px}.footer{padding:24px 0;color:#71809e;font-size:10px;display:flex;justify-content:space-between}.page{padding:55px 5px}.page h1{font:700 32px 'Space Grotesk'}.page p{max-width:600px;color:var(--muted);line-height:1.8}.light{--bg:#f4f6fc;--panel:#fff;--text:#172039;--muted:#69748d;color:var(--text);color-scheme:light}.light .side{background:white}.light .panel{background:white}.light input,.light select{background:white;color:#172039}.light .top button,.light .chip,.light .secondary{background:white;color:#172039}@media(max-width:850px){.side{width:190px}.main{padding:0 18px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.app{display:block}.side{width:auto;padding:12px}.brand{padding:5px 8px 12px}.workspace,.group{display:none}.nav{display:flex;overflow:auto;gap:5px}.nav button{white-space:nowrap;width:auto;padding:9px}.main{padding:0 13px}.hero{padding:28px 3px 22px}.hero h1{font-size:33px}.lower{grid-template-columns:1fr}.grid{gap:8px}.tile{padding:12px}.footer{gap:8px;flex-wrap:wrap}}
</style></head><body><div class="app" id="app"><aside class="side"><div class="brand">◎ GlobalLead <span>AI</span></div><div class="workspace">Personal workspace<br><small>Foundation · Module 01</small></div><nav class="nav"><div class="group">WORKSPACE</div><button class="active" data-page="Overview">▦ Overview</button><div class="group">DISCOVER</div><button data-page="Discover businesses">▣ Businesses</button><button data-page="Social opportunities">▤ Social opportunities</button><button data-page="HOT leads">♨ HOT leads</button><div class="group">MANAGE</div><button data-page="Market intelligence">▥ Market intelligence</button><button data-page="Saved leads">▣ Saved leads</button><button data-page="CRM">▧ CRM</button><div class="group">SYSTEM</div><button data-page="Integrations">◇ Integrations</button><button data-page="Settings">⚙ Settings</button></nav></aside><main class="main"><header class="top"><span>Workspace / <b id="crumb">Overview</b></span><button id="theme">☼ Toggle theme</button></header><div id="content"></div><footer class="footer"><span>© 2026 GlobalLead AI</span><span>Foundation module · Real integrations added in stages</span></footer></main></div><script>
const descriptions={'Discover businesses':'Business discovery and source-backed profiles will be connected in Module 05.','Social opportunities':'Public opportunity search through authorized sources will be connected in Module 06.','HOT leads':'HOT status will require strong evidence of urgency or buying intent.','Market intelligence':'Demand insights will be calculated from verified discovery results.','Saved leads':'Save and organize real leads after accounts and database are connected.','CRM':'Track outreach, replies, follow-ups, negotiations and deals.','Integrations':'Manage secure provider connections. API secrets will remain server-side.','Settings':'Profile, preferences and notifications will be added with authentication.'};
function home(){return '<section class="hero"><div class="eyebrow">✧ YOUR NEXT CLIENT STARTS HERE</div><h1>Turn your skills into<br><span class="accent">global opportunities.</span></h1><p>Discover businesses that need what you do. Find real demand, understand the opportunity, and make your next move.</p></section><section class="panel"><div class="eyebrow">AI OPPORTUNITY DISCOVERY</div><h2>What skill do you offer?</h2><div class="sub">Define your skill, target market and preferred discovery sources.</div><form id="search"><input id="skill" required placeholder="e.g. Web development, SEO, AI automation"><select id="country"><option>Worldwide</option><option>Pakistan</option><option>United States</option><option>United Kingdom</option><option>Canada</option><option>Australia</option><option>Germany</option><option>United Arab Emirates</option></select><select id="source"><option>Both sources</option><option>Businesses only</option><option>Social opportunities only</option></select><button class="primary">⌕ Find opportunities</button></form><div class="chips"><span class="sub">Try:</span><button class="chip" data-skill="Web Development">Web Development</button><button class="chip" data-skill="SEO">SEO</button><button class="chip" data-skill="AI Automation">AI Automation</button><button class="chip" data-skill="Graphic Design">Graphic Design</button><button class="chip" data-skill="Video Editing">Video Editing</button></div><div id="notice" class="notice"></div></section><section class="grid"><div class="tile"><small>Businesses discovered</small><b>—</b><small>No live source connected</small></div><div class="tile"><small>Social opportunities</small><b>—</b><small>Search engine pending</small></div><div class="tile"><small>HOT opportunities</small><b>—</b><small>Evidence-based ranking</small></div><div class="tile"><small>Verified contacts</small><b>—</b><small>Verification pending</small></div></section><section class="lower"><div class="tile"><h3>Global demand overview</h3><div class="empty"><strong>Your global opportunity map</strong><span>Real market coverage will appear after discovery sources connect.</span></div></div><div class="tile"><h3>Opportunity categories</h3><div class="empty"><strong>No category data yet</strong><span>No sample metrics or fabricated leads are displayed.</span></div></div></section>'}
function go(name){document.getElementById('crumb').textContent=name;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===name));document.getElementById('content').innerHTML=name==='Overview'?home():'<section class="page"><div class="eyebrow">GLOBALLEAD AI / '+name.toUpperCase()+'</div><h1>'+name+'</h1><p>'+descriptions[name]+'</p><div class="tile"><strong>Module in progress</strong><p>This section is awaiting its real backend and data integrations. No demo leads or fake metrics are shown.</p></div><p><button class="secondary" data-back>← Back to overview</button></p></section>';document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{document.getElementById('skill').value=b.dataset.skill});const f=document.getElementById('search');if(f)f.onsubmit=e=>{e.preventDefault();document.getElementById('notice').textContent='Search configuration prepared. Live discovery will activate after provider integrations are implemented.'};const back=document.querySelector('[data-back]');if(back)back.onclick=()=>go('Overview')}
document.getElementById('theme').onclick=()=>document.getElementById('app').classList.toggle('light');go('Overview');
</script></body></html>
